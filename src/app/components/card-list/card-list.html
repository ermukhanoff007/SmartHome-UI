<div class="card-list">
  @for (card of cards(); track card.id; let i = $index) {
    <app-card-item
      [card]="card"
      (edit)="onEdit($event)"
      [tabId]="tabId()"
      [editModeActive]="editMode()"
      [index]="i"
      [total]="cards().length"
      (reorder)="onMove($event)"
    >
    </app-card-item>
  }
</div>
