@if (isEmpty$ | async) {
  <div class="empty-state">
    <h2>No dashboards available</h2>
  </div>
}

<app-tabs
  [tabs]="(dashboardService.selectedDashboard$ | async)?.tabs ?? []"
  (OnChangeTab)="onChangeTab($event)"
>
</app-tabs>

@if (selectedTab$ | async; as dash) {
  <app-card-list [cards]="dash.cards"></app-card-list>
}
